<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>

    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>

      class="box-border w-[256px] shrink-0 h-[256px] relative"

        class="box-border w-[256px] h-[256px] absolute left-0 top-0 [z-index:0]"
      >
        <svg

          viewBox="0 0 24 24"
          preserveAspectRatio="none"
          xmlns="http://www.w3.org/2000/svg"

        <svg

        >
          <path d="M6.5 21.4 L3.5 18.56 Q2.7 18 3.5 17.44 L6.5 14.6 Z" fill="#000000"></path>
