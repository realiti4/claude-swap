name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # uv (not pip) so the PEP 735 dev dependency-group — pytest,
      # pytest-asyncio — installs from the committed lockfile, same as local
      # development.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      # -n 8, NOT the pyproject default of `auto`. A runner has 4 vCPUs and
      # this suite is mostly WAITING (file locks, spawned interpreters,
      # Textual pilots), so one worker per core leaves cores idle. Measured on
      # 4 CPUs, same 1995 passed: auto(=4) 16.9s, -n 6 14.1s, -n 8 14.5s,
      # -n 10 14.7s. xdist has no multiplier spelling, so the literal lives
      # here, where the runner's shape is known, rather than in pyproject.
      - name: Run tests
        run: uv run pytest -n 8

  # SHARDED, because a single Windows job cannot go much below a minute no
  # matter how fast the tests are. Measured on this repo: 13.7s checkout +
  # uv + `uv sync` (cache already hitting), 8.8s to boot 4 xdist workers and
  # collect 2000 items, 3.5s teardown — 26s before the first test runs, and
  # none of it is test time anyone can optimise away.
  #
  # Three shards each pay that floor once and split the ~51s of test
  # execution, so they finish together instead of in series. They are
  # exhaustive by construction: shards 1 and 2 name their files, shard 3
  # `--ignore`s exactly those and takes the rest, so a NEW test file lands in
  # shard 3 automatically. tests/test_ci_shards.py fails if that ever stops
  # being true.
  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Split by MEASURED time, not by file count. Linux at 4 workers:
          # tui+pin+cli 10.5s, the rest 5.2s, switcher+autoswitch 2.9s — so
          # the 618-test shard is the FAST one and the 434-test shard is the
          # slow one. Splitting by count would have put the three heaviest
          # files together.
          - name: tui-pin-cli
            paths: >-
              tests/test_tui.py tests/test_tui_pin.py tests/test_menubar.py
              tests/test_pin.py tests/test_cli.py
          - name: switcher-autoswitch
            paths: tests/test_switcher.py tests/test_autoswitch.py
          - name: rest
            paths: >-
              --ignore=tests/test_tui.py --ignore=tests/test_tui_pin.py
              --ignore=tests/test_menubar.py --ignore=tests/test_pin.py
              --ignore=tests/test_cli.py --ignore=tests/test_switcher.py
              --ignore=tests/test_autoswitch.py
    name: test-windows (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        # Includes the TUI tests: the Textual TUI (unlike the old curses one)
        # runs on stock Windows, and this job is the proof.
        #
        # `-o testpaths=` because pyproject sets `testpaths = ["tests"]`, and
        # that setting OVERRIDES positional arguments rather than being
        # narrowed by them — a shard given explicit paths silently ran the
        # whole suite without it. Measured: "no tests ran" vs 1995 passed.
        #
        # -n 4, not the 8 the unsharded job used. Each worker re-imports the
        # test modules, and on Windows booting 8 cost 16.7s against 4's 8.8s.
        # With a third of the tests per job there is nothing for the extra
        # workers to do but pay their own boot.
        run: uv run pytest -n 4 -o testpaths= ${{ matrix.paths }}

  macos-keychain:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run macOS Keychain tests (contract + real security wrapper)
        # faulthandler dumps every thread's stack if a test exceeds 60s — a
        # `security` call blocking on an invisible SecurityAgent dialog would
        # otherwise hang the job with no clue where. The step timeout is the
        # backstop that actually kills it.
        timeout-minutes: 5
        run: uv run pytest tests/test_macos_keychain_contract.py tests/test_macos_keychain.py -v -o faulthandler_timeout=60
