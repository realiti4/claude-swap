<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Swap</title>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<link rel="stylesheet" href="panel.css?v=4">
</head>
<body>
<div id="panel" aria-live="polite"></div>

<!-- Sheets: native dialogs. Content is filled and managed by sheets.js. -->
<dialog id="dlg-token" aria-labelledby="dlg-token-title">
  <h3 id="dlg-token-title">Add account</h3>
  <div class="row" style="justify-content:flex-start;margin:0 0 12px">
    <button class="btn ghost" data-dlg="login">Use current Claude Code login</button>
  </div>
  <div class="field">
    <label for="fld-email">…or email for a setup-token (optional)</label>
    <input id="fld-email" type="email" autocomplete="off">
  </div>
  <div class="field">
    <label for="fld-token">Setup token</label>
    <input id="fld-token" type="password" placeholder="sk-ant-oat01-…" autocomplete="off">
    <div class="ferr" id="fld-token-err" role="alert"></div>
  </div>
  <div class="row">
    <button class="btn ghost" data-dlg="cancel">Cancel</button>
    <button class="btn primary" data-dlg="submit-token" style="flex:none">Add account</button>
  </div>
</dialog>

<dialog id="dlg-remove" aria-labelledby="dlg-remove-title">
  <h3 id="dlg-remove-title">Remove account</h3>
  <p id="dlg-remove-body"></p>
  <div class="row">
    <button class="btn ghost" data-dlg="cancel">Cancel</button>
    <button class="btn primary danger" data-dlg="submit-remove" style="flex:none">Remove</button>
  </div>
</dialog>

<dialog id="dlg-alias" aria-labelledby="dlg-alias-title">
  <h3 id="dlg-alias-title">Edit alias</h3>
  <p class="alias-ctx" id="alias-ctx"></p>
  <div class="field">
    <label for="fld-alias">Alias</label>
    <input id="fld-alias" type="text" autocomplete="off" spellcheck="false"
           placeholder="work" aria-describedby="fld-alias-err">
    <div class="ferr" id="fld-alias-err" role="alert"></div>
  </div>
  <div class="row">
    <button class="btn ghost" data-dlg="remove-alias">Remove alias</button>
    <button class="btn ghost" data-dlg="cancel" style="flex:none">Cancel</button>
    <button class="btn primary" data-dlg="submit-alias" style="flex:none">Save</button>
  </div>
</dialog>

<dialog id="dlg-activity" aria-labelledby="dlg-activity-title">
  <h3 id="dlg-activity-title">Recent switches</h3>
  <ul class="hist" id="dlg-activity-list"></ul>
  <div class="row"><button class="btn ghost" data-dlg="cancel">Close</button></div>
</dialog>

<dialog id="dlg-overflow" aria-labelledby="dlg-overflow-title">
  <h3 id="dlg-overflow-title">Account</h3>
  <div class="row" style="flex-direction:column;align-items:stretch;gap:8px;margin-top:0">
    <button class="btn ghost" data-dlg="toggle-disabled">Disable account</button>
    <button class="btn ghost" data-dlg="open-remove">Remove account…</button>
    <button class="btn ghost" data-dlg="copy-email">Copy email</button>
    <button class="btn ghost" data-dlg="open-settings">Panel settings…</button>
  </div>
  <div class="row"><button class="btn ghost" data-dlg="cancel">Close</button></div>
</dialog>

<dialog id="dlg-settings" aria-labelledby="dlg-settings-title">
  <h3 id="dlg-settings-title">Panel settings</h3>
  <div class="field">
    <label id="lbl-appearance">Appearance</label>
    <div class="seg" id="seg-theme" role="radiogroup" aria-labelledby="lbl-appearance">
      <button type="button" class="seg-btn" role="radio" aria-checked="false" data-seg="theme" data-val="system">System</button>
      <button type="button" class="seg-btn" role="radio" aria-checked="false" data-seg="theme" data-val="light">Light</button>
      <button type="button" class="seg-btn" role="radio" aria-checked="false" data-seg="theme" data-val="dark">Dark</button>
    </div>
    <p id="theme-help">System follows your Mac’s appearance.</p>
  </div>
  <div class="field">
    <label id="lbl-refresh">Refresh interval</label>
    <div class="seg" id="seg-refreshInterval" role="radiogroup" aria-labelledby="lbl-refresh">
      <button type="button" class="seg-btn" role="radio" aria-checked="false" data-seg="refreshInterval" data-val="30">30s</button>
      <button type="button" class="seg-btn" role="radio" aria-checked="false" data-seg="refreshInterval" data-val="60">60s</button>
      <button type="button" class="seg-btn" role="radio" aria-checked="false" data-seg="refreshInterval" data-val="300">5 min</button>
    </div>
    <p>How often usage refreshes in the background.</p>
  </div>
  <div class="field">
    <label id="lbl-title">Title percentage</label>
    <div class="seg" id="seg-titlePct" role="radiogroup" aria-labelledby="lbl-title">
      <button type="button" class="seg-btn" role="radio" aria-checked="false" data-seg="titlePct" data-val="off">Off</button>
      <button type="button" class="seg-btn" role="radio" aria-checked="false" data-seg="titlePct" data-val="5h">5-hour</button>
      <button type="button" class="seg-btn" role="radio" aria-checked="false" data-seg="titlePct" data-val="7d">Weekly</button>
      <button type="button" class="seg-btn" role="radio" aria-checked="false" data-seg="titlePct" data-val="both">Both</button>
    </div>
    <p>Usage shown next to the menu bar icon.</p>
  </div>
  <div class="row"><button class="btn ghost" data-dlg="cancel">Done</button></div>
</dialog>

<div id="toasts"></div>

<script src="icons.js?v=4"></script>
<script src="appearance.js?v=2"></script>
<script src="sheets.js?v=4"></script>
<script src="panel.js?v=4"></script>
</body>
</html>
