<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-swap</title>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<link rel="stylesheet" href="panel.css?v=3">
</head>
<body>
<div id="panel" aria-live="polite"></div>

<!-- Sheets: native dialogs. Content is filled and managed by sheets.js. -->
<dialog id="dlg-token" aria-labelledby="dlg-token-title">
  <h3 id="dlg-token-title">Add from setup-token</h3>
  <div class="field">
    <label for="fld-email">Email (optional)</label>
    <input id="fld-email" type="email" autocomplete="off">
  </div>
  <div class="field">
    <label for="fld-token">Setup token</label>
    <input id="fld-token" type="password" placeholder="sk-ant-oat01-…" autocomplete="off">
    <div class="ferr" id="fld-token-err" role="alert"></div>
  </div>
  <div class="row">
    <button class="btn ghost" data-dlg="cancel">Cancel</button>
    <button class="btn primary" data-dlg="submit-token" style="flex:none">Add account</button>
  </div>
</dialog>

<dialog id="dlg-remove" aria-labelledby="dlg-remove-title">
  <h3 id="dlg-remove-title">Remove account</h3>
  <p id="dlg-remove-body"></p>
  <div class="row">
    <button class="btn ghost" data-dlg="cancel">Cancel</button>
    <button class="btn primary danger" data-dlg="submit-remove" style="flex:none">Remove</button>
  </div>
</dialog>

<dialog id="dlg-activity" aria-labelledby="dlg-activity-title">
  <h3 id="dlg-activity-title">Recent switches</h3>
  <ul class="hist" id="dlg-activity-list"></ul>
  <div class="row"><button class="btn ghost" data-dlg="cancel">Close</button></div>
</dialog>

<dialog id="dlg-overflow" aria-labelledby="dlg-overflow-title">
  <h3 id="dlg-overflow-title">Account</h3>
  <div class="row" style="flex-direction:column;align-items:stretch;gap:8px;margin-top:0">
    <button class="btn ghost" data-dlg="toggle-disabled">Disable account</button>
    <button class="btn ghost" data-dlg="open-remove">Remove account…</button>
    <button class="btn ghost" data-dlg="copy-email">Copy email</button>
    <button class="btn ghost" data-dlg="open-settings">Panel settings…</button>
  </div>
  <div class="row"><button class="btn ghost" data-dlg="cancel">Close</button></div>
</dialog>

<dialog id="dlg-settings" aria-labelledby="dlg-settings-title">
  <h3 id="dlg-settings-title">Panel settings</h3>
  <p>Refresh interval</p>
  <div class="row" style="justify-content:flex-start;gap:6px;margin-top:0">
    <button class="btn ghost" data-dlg="iv" data-iv="30">30s</button>
    <button class="btn ghost" data-dlg="iv" data-iv="60">60s</button>
    <button class="btn ghost" data-dlg="iv" data-iv="300">5 min</button>
  </div>
  <p style="margin-top:12px">Title percentage</p>
  <div class="row" style="justify-content:flex-start;gap:6px;margin-top:0">
    <button class="btn ghost" data-dlg="tp" data-tp="off">off</button>
    <button class="btn ghost" data-dlg="tp" data-tp="5h">5h</button>
    <button class="btn ghost" data-dlg="tp" data-tp="7d">7d</button>
    <button class="btn ghost" data-dlg="tp" data-tp="both">both</button>
  </div>
  <div class="row"><button class="btn ghost" data-dlg="cancel">Done</button></div>
</dialog>

<div id="toasts"></div>

<script src="icons.js?v=3"></script>
<script src="sheets.js?v=3"></script>
<script src="panel.js?v=3"></script>
</body>
</html>
