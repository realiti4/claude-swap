[project]
name = "claude-swap"
version = "0.25.0b1"
description = "Multi-account switcher for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Windows-only: needed solely by the one-time keyring -> files migration
    # (migrations.py) for users upgrading from <=0.10.x. macOS/Linux never
    # import it on the hot path; the macOS migration has a security-CLI
    # fallback and the legacy purge sweep no-ops when it's absent.
    "keyring>=25.0.0; sys_platform == 'win32'",
    "textual>=8.2.8,<9",
    "truststore>=0.10.4",
]
authors = [{name = "Onur Cetinkol", email = "onurcetinkol@gmail.com"}]
license = {text = "MIT"}
keywords = ["claude", "claude-code", "account-switcher", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.optional-dependencies]
menubar = ["rumps>=0.4.0"]
# NO FLOOR. A pinned minimum here is a constant somebody has to remember to
# raise, and it does not survive the release cycle: this one sat at 0.1.3
# through THIRTY-SIX releases, so `uv tool install 'claude-swap[pin]'`
# resolved a pin from before the port handdown, the chain walk and the launch
# hook — while the machine looked correctly installed. The user's dotfiles
# then grew 248 lines of installer to work around it.
#
# An unpinned requirement resolves to the LATEST release, which is what a
# fresh install should get and what a floor was only ever approximating.
# Keeping an old release out is an INSTALL-time job, not a constant this
# project re-litigates on someone else's release cadence — the same reasoning
# `_impl` already applies to the runtime check it deliberately does not do.
#
# THE ONE FLOOR THAT IS NOT AN APPROXIMATION. Everything above argues against
# a floor that chases freshness, and that still holds. This bound names a
# boundary instead, and the boundary cannot move: before 0.1.2, wiring the pin
# wrote `.claude.json` with `write_text`, which takes the umask — 022 on every
# machine here — and the rename made 0644 permanent. Turning this extra on is
# exactly what puts the proxy's own credential in that file, as userinfo in
# `HTTPS_PROXY`. So on 0.1.1 and below, ENABLING THE FEATURE PUBLISHES A
# CREDENTIAL to every local user. 0.1.2 creates the temp file 0600 via
# O_CREAT|O_EXCL with an explicit mode and never widens an existing config.
#
# Verified rather than assumed, both directions:
#   v0.1.1  tmp.write_text(json.dumps(raw, indent=2), encoding="utf-8")
#   v0.1.2  mode = _mode_of(path, default=0o600); os.open(..., O_EXCL, mode)
#
# And it is not a freshness proxy: the seam this extra actually calls —
# `heal`, `load_pin`, `apply_pin` — has byte-identical signatures from v0.1.0
# through 0.1.68, so nothing here is bounding an API. Only the credential.
pin = ["cswap-pin>=0.1.2"]

[project.urls]
Homepage = "https://github.com/realiti4/claude-swap"
Repository = "https://github.com/realiti4/claude-swap"
Issues = "https://github.com/realiti4/claude-swap/issues"

[project.scripts]
claude-swap = "claude_swap.cli:main"
cswap = "claude_swap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_swap"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-xdist>=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Parallel by default. The suite is ~1900 tests of mostly-idle work (file
# locks, subprocess fakes, Textual pilots), so wall clock was dominated by
# doing them one at a time, not by any single slow test: 25 ms/test spread
# across the whole suite, with the top five totalling under 7 s of a 51 s run.
# Measured here, 48 cores: 51.0s serial -> 12.1s (-n 8) -> 7.7s (-n 16), same
# 1929 passed / 4 skipped every time, three consecutive runs, real account
# store hash unmoved.
#
# `auto` here so any machine scales from the cores it has. CI OVERRIDES IT
# with `-n 8` (see .github/workflows/ci.yml): the work is mostly WAITING —
# file locks, spawned interpreters, Textual pilots — so on a runner's 4 vCPUs
# a worker parked on a syscall leaves its core idle and one-worker-per-core
# cannot fill them. Measured on 4 CPUs (`taskset -c 0-3`), same 1995 passed:
#
#     -n auto (=4)  16.94s  16.97s
#     -n 6          14.06s
#     -n 8          15.49s  14.52s
#     -n 10         14.69s
#
# xdist takes only `auto`, `logical`, or an integer — there is no multiplier
# spelling, and `logical` is also 4 on a 4-vCPU runner. So the oversubscription
# has to be a literal, and a literal belongs where the machine is known.
addopts = "-n auto --dist loadgroup"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "no_keychain_fake: opt out of the autouse in-memory Keychain guard (test mocks subprocess itself, or runs against a temp keychain on GitHub Actions)",
]
