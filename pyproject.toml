[project]
name = "claude-swap"
version = "0.27.0b1"
description = "Multi-account switcher for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Windows-only: needed solely by the one-time keyring -> files migration
    # (migrations.py) for users upgrading from <=0.10.x. macOS/Linux never
    # import it on the hot path; the macOS migration has a security-CLI
    # fallback and the legacy purge sweep no-ops when it's absent.
    "keyring>=25.0.0; sys_platform == 'win32'",
    "textual>=8.2.8,<9",
    "truststore>=0.10.4",
]
authors = [{name = "Onur Cetinkol", email = "onurcetinkol@gmail.com"}]
license = {text = "MIT"}
keywords = ["claude", "claude-code", "account-switcher", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.optional-dependencies]
menubar = ["rumps>=0.4.0"]
# A CORRECTNESS FLOOR, not a freshness one: below it, this branch's
# `apply_pin(identity=...)` is a TypeError at the call rather than a degraded
# feature. Raise it for each API this branch requires OUTRIGHT, and name the
# error the old version actually raises. `heal(identity=...)` is deliberately
# NOT covered -- the caller probes the installed signature and falls back to
# the positional form -- so do not raise the floor for it and do not delete
# that probe as redundant. `carry_live_pointers`, `remembered_pin_identity`
# and `_pointer_owner` are not covered either: absent below 0.1.223, 0.1.215
# and 0.1.232, `_ask` answers None there -- `_pointer_owner` absent skips the
# carry outright -- and every caller reads None as the behaviour it had
# before the seam existed. Degraded, not a TypeError -- which is what keeps
# this floor a correctness one.
#
# 0.1.303 is where `set_pin`, `repin_current` and `pin_run` live: `cswap pin
# <n>` and the TUI hand off to them, and a release without them raises
# AttributeError at that call.
#
# 0.1.309 is where `apply_pin` takes the keyword-only `everywhere` and the
# `pin-cleared` marker `cswap pin --clear` writes is honoured: its set arm
# unlinks it and `load_pin` reads None while it exists. On 0.1.303-0.1.308 a
# re-pin leaves the marker, so the host reads as cleared after a successful pin.
#
# NO `; sys_platform != 'win32'` MARKER (proposed twice): the dev group
# installs this so the seam test runs on Windows too, and a marker makes that
# test decorative instead of red.
pin = ["cswap-pin>=0.1.309"]

[project.urls]
Homepage = "https://github.com/realiti4/claude-swap"
Repository = "https://github.com/realiti4/claude-swap"
Issues = "https://github.com/realiti4/claude-swap/issues"

[project.scripts]
claude-swap = "claude_swap.cli:main"
cswap = "claude_swap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_swap"]

[dependency-groups]
# `claude-swap[pin]`, NOT a second `cswap-pin>=...`: the extra above is the one
# floor, and spelling the version again here is how the two drift.
#
# The extra has to be installed somewhere or its contract is untested. cswap
# READS a marker cswap-pin WRITES and the two version independently, so
# `test_the_marker_still_matches_the_package_that_writes_it` is the only thing
# standing between a rename there and `--clear` reporting "No cloud account
# pinned" over a live wiring. `uv sync --locked` installs base + dev only, so
# without this it never ran.
#
# This does NOT weaken "works without the extra": `TestImportSafeWithoutTheExtra`
# and `TestClearRunsWithTheExtraGone` block `cswap_pin` at `sys.meta_path` or
# scan the AST, so they hold whether or not the package is present.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.5",
    "claude-swap[pin]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# A THREAD THAT DIES ON AN EXCEPTION FAILS THE RUN. Unhandled it is only a
# warning, and a warning in a list of ~50 is read by nobody: one sat on every
# run for as long as anyone had looked. This makes the next one fail instead
# of joining the list.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]
# Parallel by default. The suite is ~1900 tests of mostly-idle work (file
# locks, subprocess fakes, Textual pilots), so wall clock was dominated by
# doing them one at a time, not by any single slow test: 25 ms/test spread
# across the whole suite, with the top five totalling under 7 s of a 51 s run.
# Measured here, 48 cores: 51.0s serial -> 12.1s (-n 8) -> 7.7s (-n 16), same
# 1929 passed / 4 skipped every time, three consecutive runs, real account
# store hash unmoved. `auto` rather than a fixed number so CI runners (2-4
# cores) and this box both get the cores they have.
addopts = "-n auto --dist loadgroup"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "no_keychain_fake: opt out of the autouse in-memory Keychain guard (test mocks subprocess itself, or runs against a temp keychain on GitHub Actions)",
    "no_oauth_profile_fake: opt out of the autouse fetch_oauth_profile stub (test exercises fetch_oauth_profile itself against a mocked urlopen)",
    "no_policy_limits_fake: opt out of the autouse fetch_policy_limits stub (test exercises fetch_policy_limits itself against a mocked urlopen)",
]
